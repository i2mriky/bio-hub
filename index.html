  for (let i = 0; i < max; i++) lists.forEach((l, k) => { if (l[i]) items.push({ src: l[i], s: srcs[k] }); });
  const sec = box.closest("section");
  if (!items.length){ sec.remove(); document.querySelector('#nav a[data-id="wall"]')?.remove(); return; }
  box.hidden = false;
  box.querySelector(".sh h2").insertAdjacentHTML("beforeend", `<sup>${items.length}</sup>`);
  const fl = box.querySelector(".wl-f"), g = box.querySelector(".wl-g"), more = box.querySelector(".wl-more");
  const used = srcs.map((s, k) => [s, lists[k].length]).filter(x => x[1]);
  fl.innerHTML = used.length > 1 ? `<button class="on" data-f="">All<i>${items.length}</i></button>` + used.map(([s, n]) => `<button data-f="${esc(s.key)}">${esc(s.label)}<i>${n}</i></button>`).join("") : "";
  let filt = "", open = false, view = [];
  const draw = () => {
    view = items.filter(x => !filt || x.s.key === filt);
    const shown = open ? view : view.slice(0, per);
    g.innerHTML = shown.map((x, k) => `<button class="wt" data-i="${k}" style="--tc:${esc(x.s.color || "var(--accent)")}" aria-label="${esc(x.s.label)} review ${k + 1}"><img src="${esc(x.src)}" alt="" loading="lazy" decoding="async"><b>${esc(x.s.label)}</b></button>`).join("");
    more.hidden = open || view.length <= per; more.textContent = `Show all ${view.length}`;
  };
  fl.addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filt = b.dataset.f; open = false;
    fl.querySelectorAll("[data-f]").forEach(x => x.classList.toggle("on", x === b)); draw(); }, SIG);
  more.addEventListener("click", () => { open = true; draw(); }, SIG);
  /* lightbox */
  let lb = document.getElementById("lb");
  if (!lb){ lb = document.createElement("div"); lb.id = "lb"; lb.className = "lbx"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
    lb.innerHTML = `<div class="lb-top"><div><b></b><span></span></div><button class="lb-x" aria-label="Close">✕</button></div><div class="lb-im"><img alt=""></div><div class="lb-nav"><button class="lb-p" aria-label="Previous">‹</button><button class="lb-n" aria-label="Next">›</button></div>`;
    document.body.appendChild(lb); }
  let at = 0;
  const show = k => { at = (k + view.length) % view.length; const x = view[at];
    lb.querySelector(".lb-im img").src = x.src; lb.querySelector(".lb-top b").textContent = x.s.label; lb.querySelector(".lb-top span").textContent = `${at + 1} / ${view.length}`; };
  const shut = () => { lb.classList.remove("on"); document.documentElement.classList.remove("dp-lock"); };
  g.addEventListener("click", e => { const b = e.target.closest(".wt"); if (!b) return; show(+b.dataset.i); lb.classList.add("on"); document.documentElement.classList.add("dp-lock"); lb.querySelector(".lb-x").focus({ preventScroll: true }); }, SIG);
  lb.querySelector(".lb-x").onclick = shut; lb.querySelector(".lb-p").onclick = () => show(at - 1); lb.querySelector(".lb-n").onclick = () => show(at + 1);
  lb.onclick = e => { if (e.target === lb || e.target.classList.contains("lb-im")) shut(); };
  addEventListener("keydown", e => { if (!lb.classList.contains("on")) return; if (e.key === "Escape") shut(); if (e.key === "ArrowRight") show(at + 1); if (e.key === "ArrowLeft") show(at - 1); }, SIG);
  let x0 = null; const im = lb.querySelector(".lb-im");
  im.ontouchstart = e => { x0 = e.touches[0].clientX; }; im.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1)); };
  draw();
}

/* ---------- Before / After ---------- */
function initBA(SIG, slow){
  const box = document.querySelector("[data-ba]"); if (!box) return;
  const ba = D.beforeAfter || {}, items = live(ba.items), sec = box.closest("section");
  const h = box.querySelector(".ba-h"), say = sec.querySelector(".ba-say"), io = sec.querySelectorAll("[data-io]");
  const S = ba.says || {};
  let p = 92, anim = 0, zone = "";
  const set = v => {
    p = Math.max(0, Math.min(100, v));
    box.style.setProperty("--p", p + "%"); h.setAttribute("aria-valuenow", Math.round(p));
    box.querySelector(".ba-t.l").style.opacity = p < 18 ? 0 : 1;
    box.querySelector(".ba-t.r").style.opacity = p > 82 ? 0 : 1;
    const z = p > 66 ? "b" : p < 34 ? "a" : "m";
    if (z !== zone){ zone = z; say.innerHTML = esc(S[z] || "").replace(/\*(.+?)\*/g, "<b>$1</b>");
      io.forEach(x => x.classList.toggle("on", x.dataset.io === z)); }
  };
  const stop = () => { cancelAnimationFrame(anim); anim = 0; box.classList.add("used"); };
  const tween = (to, ms, done) => { const from = p, t0 = performance.now();
    const k = t => { const e = Math.min(1, (t - t0) / ms), q = e < .5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
      set(from + (to - from) * q); if (e < 1) anim = requestAnimationFrame(k); else { anim = 0; done && done(); } };
    anim = requestAnimationFrame(k); };
  set(92);
  /* first time in view: the scene builds itself, then settles in the middle */
  const vo = new IntersectionObserver(es => { if (es[0].isIntersecting){ vo.disconnect();
    if (slow) return set(50);
    setTimeout(() => { if (!box.classList.contains("used")) tween(8, 1500, () => setTimeout(() => !box.classList.contains("used") && tween(50, 900), 500)); }, 350); } }, { threshold: .55 });
  vo.observe(box); AC.signal.addEventListener("abort", () => vo.disconnect());
  const at = x => { const r = box.getBoundingClientRect(); set((x - r.left) / r.width * 100); };
  let id = null;
  box.addEventListener("pointerdown", e => { if (e.button > 0) return; stop(); id = e.pointerId; box.classList.add("drag"); at(e.clientX);
    try { box.setPointerCapture(id); } catch (_) {} }, SIG);
  box.addEventListener("pointermove", e => { if (e.pointerId === id) at(e.clientX); }, SIG);
  const end = e => { if (e.pointerId === id){ id = null; box.classList.remove("drag"); } };
  box.addEventListener("pointerup", end, SIG); box.addEventListener("pointercancel", end, SIG);
  h.addEventListener("keydown", e => { const m = { ArrowLeft: -5, ArrowRight: 5, PageDown: -20, PageUp: 20 }[e.key];
    if (m !== undefined){ stop(); set(p + m); e.preventDefault(); }
    else if (e.key === "Home" || e.key === "End"){ stop(); set(e.key === "Home" ? 0 : 100); e.preventDefault(); } }, SIG);
  sec.querySelectorAll("[data-bat]").forEach(b => b.addEventListener("click", () => {
    const x = items[+b.dataset.bat]; if (!x) return;
    sec.querySelectorAll("[data-bat]").forEach(y => y.classList.toggle("on", y === b));
    box.querySelector(".ba-a").src = x.after; box.querySelector(".ba-b img").src = x.before;
    io[0].querySelector("span").textContent = x.send || ""; io[1].querySelector("span").textContent = x.get || "";
    sec.querySelector(".ba-cr").textContent = x.credit || "";
    stop(); set(92); if (!slow) tween(50, 1100);
  }, SIG));
}

/* ================= ARCADE: Brief Catcher + Rally ================= */
function initGame(){
  const stage = document.getElementById("stage"); if (!stage) return;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const acc = css("--accent") || "#E07848", ink = css("--ink") || "#F2EFE9", mut = css("--muted") || "#8A847C";

  let W = 0, H = 0, mode = "catcher", run = false, raf = null, tx = 0;
  const S = {};
  const best = { catcher: 0, pong: 0 };
  try { best.catcher = +(localStorage.getItem("nm_best_catcher") || 0) || 0;
        best.pong = +(localStorage.getItem("nm_best_pong") || 0) || 0; } catch(e){}

  function size(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.px === undefined) S.px = W / 2;
    S.px = Math.min(Math.max(S.px, 30), W - 30); tx = S.px;
  }
  new ResizeObserver(size).observe(cv); size();

  const hud = (a, b, c) => { l1.textContent = a; l2.textContent = b; l3.textContent = c; };
  const vals = (a, b, c) => { v1.textContent = a; v2.textContent = b; v3.textContent = c; };
  function rr(x, y, w, h, r){ ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); ctx.fill(); }

  /* --- the persona: backwards cap, copper aviators, beard --- */
  function persona(x, y, s){
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#3B2A20"; ctx.beginPath(); ctx.ellipse(0, s * .20, s * .50, s * .54, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#C89A74"; ctx.beginPath(); ctx.ellipse(0, 0, s * .44, s * .50, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#141418";
    ctx.beginPath(); ctx.ellipse(0, -s * .16, s * .50, s * .40, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-s * .50, -s * .20, s, s * .11);
    ctx.fillStyle = "#2C2C34"; ctx.fillRect(-s * .09, -s * .19, s * .18, s * .09);
    ctx.fillStyle = "#0C0C10"; rr(-s * .42, -s * .05, s * .36, s * .24, 3); rr(s * .06, -s * .05, s * .36, s * .24, 3);
    ctx.strokeStyle = acc; ctx.lineWidth = Math.max(1, s * .05);
    ctx.beginPath(); ctx.moveTo(-s * .06, s * .04); ctx.lineTo(s * .06, s * .04); ctx.stroke();
    ctx.restore();
  }

  /* ---------------- BRIEF CATCHER ---------------- */
  const catcher = {
    hud(){ hud("Score", "Best", "Lives"); vals(S.score | 0, best.catcher, S.lives | 0); },
    init(){ S.items = []; S.score = 0; S.lives = 3; S.spawn = 0; S.px = tx = W / 2; this.hud(); },
    idle(){ persona(W / 2, H - 34, 40); },
    step(){
      S.px += (tx - S.px) * .22;
      const sp = 1.8 + S.score * .05, rate = Math.max(16, 44 - S.score * .8);
      if (--S.spawn <= 0){ S.spawn = rate;
        S.items.push({ x: 24 + Math.random() * (W - 48), y: -18, t: Math.random() < .27 ? "rev" : "brief" }); }
      for (let k = S.items.length - 1; k >= 0; k--){
        const it = S.items[k]; it.y += sp;
        ctx.save(); ctx.translate(it.x, it.y);
        if (it.t === "brief"){ ctx.rotate(Math.PI / 4); ctx.fillStyle = acc; rr(-7, -7, 14, 14, 3); }
        else { ctx.strokeStyle = mut; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 9, 0, 7); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(4, 4); ctx.moveTo(4, -4); ctx.lineTo(-4, 4); ctx.stroke(); }
        ctx.restore();
        if (Math.abs(it.x - S.px) < 26 && it.y > H - 62 && it.y < H - 14){
          S.items.splice(k, 1);
          if (it.t === "brief") S.score++; else S.lives--;
          this.hud();
          if (S.lives <= 0){ persona(S.px, H - 34, 40); return this.end(); }
        } else if (it.y > H + 20) S.items.splice(k, 1);
      }
      persona(S.px, H - 34, 40);
    },
    end(){ save("catcher", S.score);
      finish(S.score >= 25 ? "Hired." : S.score >= 10 ? "Not bad." : "Revisions won.",
        "You caught " + S.score + " brief" + (S.score === 1 ? "" : "s") + ". Best: " + best.catcher + "."); }
  };

  /* ---------------- RALLY (pong vs the machine) ---------------- */
  const PW = 74, PH = 9;
  const pong = {
    hud(){ hud("You", "Machine", "Best rally"); vals(S.you | 0, S.cpu | 0, best.pong); },
    init(){ S.you = 0; S.cpu = 0; S.rally = 0; S.ai = W / 2; S.px = tx = W / 2; this.serve(1); this.hud(); },
    serve(dir){ S.ball = { x: W / 2, y: H / 2, vx: (Math.random() * 2 - 1) * 2.2, vy: 3.1 * dir }; S.rally = 0; },
    idle(){ ctx.fillStyle = acc; rr(W / 2 - PW / 2, H - 20, PW, PH, 5); rr(W / 2 - PW / 2, 11, PW, PH, 5);
      ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(W / 2, H / 2, 7, 0, 7); ctx.fill(); },
    step(){
      const b = S.ball;
      S.px += (tx - S.px) * .28;
      S.ai += Math.max(-(2.6 + S.rally * .06), Math.min(2.6 + S.rally * .06, (b.x - S.ai) * .12));
      S.ai = Math.min(Math.max(S.ai, PW / 2), W - PW / 2);

      b.x += b.vx; b.y += b.vy;
      if (b.x < 8){ b.x = 8; b.vx *= -1; } if (b.x > W - 8){ b.x = W - 8; b.vx *= -1; }

      const hit = (paddleX, edgeY, down) => {
        if (Math.abs(b.x - paddleX) < PW / 2 + 6 && Math.abs(b.y - edgeY) < 10){
          b.vy = Math.abs(b.vy) * (down ? 1 : -1) * 1.03;
          b.vx += (b.x - paddleX) * .09;
          b.vx = Math.max(-5.5, Math.min(5.5, b.vx));
          S.rally++; if (S.rally > best.pong){ best.pong = S.rally; }
          this.hud(); return true;
        } return false;
      };
      if (b.vy > 0) hit(S.px, H - 20, false); else hit(S.ai, 20, true);

      if (b.y > H + 14){ S.cpu++; this.hud(); if (S.cpu >= 5) return this.end(false); this.serve(-1); }
      if (b.y < -14){ S.you++; this.hud(); if (S.you >= 5) return this.end(true); this.serve(1); }

      ctx.strokeStyle = mut; ctx.globalAlpha = .35; ctx.setLineDash([5, 7]);
      ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = mut; rr(S.ai - PW / 2, 11, PW, PH, 5);
      ctx.fillStyle = acc; rr(S.px - PW / 2, H - 20, PW, PH, 5);
      ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 7); ctx.fill();
    },
    end(won){ save("pong", best.pong);
      finish(won ? "You beat the machine." : "The machine wins.",
        "Final " + S.you + " to " + S.cpu + ". Best rally: " + best.pong + "."); }
  };

  const G = { catcher, pong };
  function save(k, v){ if (v > best[k]) best[k] = v; try { localStorage.setItem("nm_best_" + k, best[k]); } catch(e){} }

  function finish(title, line){
    run = false; cancelAnimationFrame(raf); raf = null;
    ovlT.textContent = title; ovlP.textContent = line; ovlB.textContent = "Play again";
    ovl.classList.remove("off");
  }
  function loop(){ ctx.clearRect(0, 0, W, H); G[mode].step(); if (run) raf = requestAnimationFrame(loop); }
  function start(){ G[mode].init(); ovl.classList.add("off"); run = true; if (!raf) raf = requestAnimationFrame(loop); }
  function pause(){ if (!run) return; run = false; cancelAnimationFrame(raf); raf = null;
    ovlT.textContent = "Paused"; ovlP.textContent = "Tap to resume."; ovlB.textContent = "Resume"; ovl.classList.remove("off"); }
  function idle(){ ctx.clearRect(0, 0, W, H); G[mode].hud(); G[mode].idle(); }

  ovlB.addEventListener("click", () => {
    if (ovlB.textContent === "Resume"){ ovl.classList.add("off"); run = true; raf = requestAnimationFrame(loop); }
    else start();
  });

  document.querySelectorAll("[data-g]").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-g]").forEach(b => b.classList.toggle("on", b === btn));
    run = false; cancelAnimationFrame(raf); raf = null;
    mode = btn.dataset.g; S.px = tx = W / 2;
    G[mode].init(); idle();
    ovlT.textContent = mode === "pong" ? "Rally" : "Brief Catcher";
    ovlP.textContent = mode === "pong" ? "First to five. The machine does not get tired." : "Catch the briefs, dodge the revisions.";
    ovlB.textContent = "Play"; ovl.classList.remove("off");
  }));

  const aim = e => { const r = cv.getBoundingClientRect(); tx = Math.min(Math.max(e.clientX - r.left, 30), W - 30); };
  stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); aim(e); });
  stage.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") aim(e); });
  addEventListener("keydown", e => {
    if (!run) return;
    if (e.key === "ArrowLeft"){ tx = Math.max(30, tx - 36); e.preventDefault(); }
    if (e.key === "ArrowRight"){ tx = Math.min(W - 30, tx + 36); e.preventDefault(); }
  }, { signal: AC.signal });

  document.addEventListener("visibilitychange", () => document.hidden && pause(), { signal: AC.signal });
  new IntersectionObserver(es => es.forEach(e => !e.isIntersecting && pause()), { threshold: .15 }).observe(stage);

  G.catcher.init(); idle();
}


let tt; function toastIt(m){ toast.textContent = m; toast.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("on"), 2000); }

addEventListener("message", e => { if (e.data?.__nm) paint(e.data.__nm); });
paint(FALLBACK);
fetch("data.json?v=" + Date.now()).then(r => r.ok ? r.json() : null).then(j => j && JSON.stringify(j) !== JSON.stringify(FALLBACK) && paint(j)).catch(() => {});
