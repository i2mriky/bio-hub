<!DOCTYPE html>
<html lang="en" data-theme="copper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nour Mohamed — Creative Director & AI Specialist</title>
<meta name="description" content="Creative Director and AI specialist in New Cairo. Portfolios, brands, numbers and contact in one place.">
<meta name="theme-color" content="#0B0A0C" id="tc">
<meta property="og:type" content="profile">
<meta property="og:title" content="Nour Mohamed — Creative Director & AI Specialist">
<meta property="og:description" content="7M organic views in 90 days. Portfolios, brands and contact in one place.">
<meta property="og:image" content="https://2mriky.github.io/bio-hub/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0A0C'/%3E%3Ctext x='32' y='43' font-family='Arial' font-size='30' font-weight='900' fill='%23E07848' text-anchor='middle'%3EN*%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Readex+Pro:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A0C; --ink:#F2EEE8; --muted:#9C958D; --accent:#E07848; --on-accent:#140C08;
  --c-m3anyi:#D96A3C; --c-gray:#8C7FD6;
  --line:color-mix(in srgb,var(--ink) 11%,transparent);
  --line-2:color-mix(in srgb,var(--ink) 22%,transparent);
  --surf:color-mix(in srgb,var(--ink) 4.5%,var(--bg));
  --surf-2:color-mix(in srgb,var(--ink) 8%,var(--bg));
  --band:color-mix(in srgb,var(--ink) 2.6%,var(--bg));
  --fd:'Syne',system-ui,sans-serif; --fb:'Readex Pro',system-ui,sans-serif; --fn:'Archivo','Readex Pro',system-ui,sans-serif;
  --r:16px; --maxw:1080px; --gut:24px; --head:60px;
}
[data-theme="athar"] {--bg:#0B1A2F;--ink:#EDEAE3;--muted:#93A1B3;--accent:#D3734A}
[data-theme="museum"]{--bg:#150F18;--ink:#EFE7DA;--muted:#A596A6;--accent:#C9A961}
[data-theme="mono"]  {--bg:#0E0E0E;--ink:#FFFFFF;--muted:#9A9A9A;--accent:#F2F2F2;--on-accent:#0E0E0E}
[data-theme="bone"]  {--bg:#EDE9E1;--ink:#16120F;--muted:#645D55;--accent:#B5451E;--on-accent:#FFF8F2;--c-m3anyi:#B4532A;--c-gray:#6D5FC4}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--head) + 12px)}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-weight:400;font-size:16px;line-height:1.6;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:calc(var(--gut) + env(safe-area-inset-left)) calc(var(--gut) + env(safe-area-inset-right))}
@media(max-width:600px){:root{--gut:18px}}
.n{font-family:var(--fn);font-stretch:125%;font-weight:800;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.02em}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .25s,background .4s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:var(--head)}
.logo{font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:none;display:flex;align-items:center;min-height:44px}
.logo i{font-style:normal;color:var(--accent)}
.logo img{height:22px;width:auto;display:block}
.nav{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;min-height:40px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--muted);border-radius:999px;transition:color .2s,background .2s}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--surf-2)}
.icons{display:flex;gap:6px;flex:none}
.ib{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--muted);transition:.2s}
.ib:hover{color:var(--accent);border-color:var(--accent)}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:640px){.ib.qr{display:none}.nav a{padding:8px 10px;font-size:13.5px}}

/* ---------- hero ---------- */
.hero{padding:24px 0 60px}
.h-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.photo{position:relative;width:64px;height:64px;border-radius:20px;overflow:hidden;flex:none;background:var(--surf-2);border:1px solid var(--line-2)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
@media(min-width:760px){.photo{width:84px;height:84px;border-radius:24px}}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.dot.live{animation:blink 1.7s steps(1,end) infinite}
@keyframes blink{0%,58%{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}59%,100%{opacity:.22;box-shadow:none}}
h1{font-family:var(--fd);font-weight:800;letter-spacing:-.045em;line-height:.9;font-size:clamp(34px,10.2vw,104px);margin-top:22px}
.role{margin-top:16px;font-size:clamp(17px,2.6vw,21px);font-weight:500;color:var(--accent)}
.bio{margin-top:14px;max-width:48ch;color:var(--muted);font-size:17px;font-weight:300;line-height:1.65}
.focus{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px 0;font-size:14px;font-weight:500}
.focus span:not(:last-child)::after{content:"/";margin:0 10px;color:var(--line-2);font-weight:300}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);font-size:15px;font-weight:500;transition:transform .2s,border-color .2s,color .2s,background .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.solid:hover{color:var(--on-accent);filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.me-socs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);transition:.2s}
.si:hover{color:var(--accent);border-color:var(--accent)}
.si svg{width:18px;height:18px;fill:currentColor}

/* ---------- sections ---------- */
.sec{padding:76px 0;border-top:1px solid var(--line)}
.sec.band{background:var(--band)}
@media(max-width:600px){.sec{padding:56px 0}}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:30px}
.sh h2{font-family:var(--fd);font-weight:700;font-size:clamp(30px,6vw,44px);letter-spacing:-.035em;line-height:1}
.sh h2 sup{font-family:var(--fb);font-weight:500;font-size:14px;letter-spacing:0;color:var(--muted);vertical-align:top;margin-left:6px;position:relative;top:4px}
.sh p{color:var(--muted);font-size:15px;max-width:42ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.card{position:relative;display:block;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .25s,transform .25s}
a.card:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-3px)}
.go{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);transition:.25s}
.go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
a.card:hover .go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* portfolio */
.cover{position:relative;display:block;aspect-ratio:16/9;background:var(--surf-2);overflow:hidden;border-bottom:1px solid var(--line)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
a.card:hover .cover img{transform:scale(1.035)}
.plate{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:56px;color:var(--line-2)}
.tag{position:absolute;left:14px;bottom:14px;z-index:1;font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pf-b{display:flex;align-items:center;gap:16px;padding:22px 24px 24px}
.pf-b div{flex:1;min-width:0}
.pf-b h3{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.pf-b p{margin-top:5px;color:var(--muted);font-size:14px;line-height:1.5}

/* ---------- numbers ---------- */
.period{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.ntop{display:grid;gap:18px;margin-top:22px;align-items:end}
@media(min-width:860px){.ntop{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.total .period{margin-bottom:16px}
.total b{display:block;font-size:clamp(54px,14vw,108px);line-height:.86}
.total b .u{color:var(--accent)}
.total p{margin-top:12px;max-width:30ch;color:var(--muted);font-size:15px}
.trend{padding:18px 18px 12px}
.tr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tr-h small{display:block;font-size:12.5px;color:var(--muted)}
.tr-h b{display:block;font-size:22px;line-height:1.1;margin-top:3px}
.tabs2{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs2 button{font-size:12.5px;font-weight:500;color:var(--muted);padding:6px 11px;border-radius:999px;min-height:32px}
.tabs2 button.on{background:var(--surf-2);color:var(--ink)}
.tr-svg{position:relative;margin-top:10px;touch-action:pan-y}
.tr-svg svg{display:block;width:100%;height:150px;overflow:visible}
.tr-tip{position:absolute;top:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .15s}
.tr-tip.on{opacity:1}
.tr-x{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px;font-size:13px;font-weight:500;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.chart{margin-top:12px;display:grid;gap:8px}
.rowb{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .2s,background .2s}
.rowb:hover{border-color:var(--line-2)}
.rowb[aria-expanded="true"]{border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:var(--surf-2)}
.rh{display:flex;align-items:center;gap:12px}
.pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surf-2);color:var(--ink)}
.pi svg{width:17px;height:17px;fill:currentColor}
.who{flex:1;min-width:0}
.who small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.who b{display:block;font-size:24px;line-height:1.15;margin-top:2px}
.who b em{font-style:normal;font-family:var(--fb);font-stretch:100%;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0;margin-left:6px}
.chev{width:28px;height:28px;display:grid;place-items:center;color:var(--muted);transition:transform .25s}
.chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rowb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.track{margin-top:12px;height:8px;border-radius:4px;background:var(--surf-2);overflow:hidden}
.fill{height:100%;border-radius:4px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1) var(--d,0s)}
.more-d{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.rowb[aria-expanded="true"] .more-d{grid-template-rows:1fr}
.more-d>.md-in{display:block;overflow:hidden;min-height:0}
.kv{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}
.kv span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--muted)}
.kv span b{color:var(--ink);font-weight:500}
.kv .up{color:#8FD19E;border-color:color-mix(in srgb,#8FD19E 35%,transparent)}
.proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:28px}
.proof{padding:20px}
.proof b{display:block;font-size:30px;line-height:1;color:var(--accent)}
.proof span{display:block;margin-top:10px;color:var(--muted);font-size:14px;line-height:1.5}
.sub-h{margin-top:34px;font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.02em}
.src{margin-top:18px;color:var(--muted);font-size:12.5px}
@media(max-width:600px){.proofs{grid-template-columns:1fr 1fr}.proof{padding:16px}.proof b{font-size:clamp(20px,6vw,26px)}.proof span{font-size:12.5px}}

/* ---------- results ---------- */
.res{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.rc{padding:22px 22px 24px;display:flex;flex-direction:column;gap:6px}
.rc::before{content:"";width:28px;height:3px;border-radius:2px;background:var(--accent);margin-bottom:12px}
.rc .who{font-size:13px;color:var(--muted)}
.rc .who b{display:block;font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.rc .n{font-size:clamp(34px,9vw,46px);line-height:1;color:var(--accent);margin-top:14px}
.rc .lb{font-size:15px;font-weight:500}
.rc .ex{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:4px}
.tb{margin-top:14px;padding:20px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line)}
.tb-h{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
@media(min-width:620px){.tb-h{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px}}
.tb-h b{white-space:nowrap}
.tb-h b{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em}
.tb-h small{font-size:12px;color:var(--muted)}
.tb-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:820px){.tb-g{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 6px 14px;border-radius:14px;background:var(--surf-2);border:1px solid var(--line)}
.tl i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tl b{font-size:13px;font-weight:600;line-height:1.25}
.tl small{font-size:11px;color:var(--muted);margin-top:-6px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

/* ---------- map ---------- */
.map-h{font-family:var(--fd);font-weight:800;font-size:clamp(26px,6.4vw,48px);letter-spacing:-.035em;line-height:1.02;max-width:16ch}
.map-p{margin-top:12px;color:var(--muted);font-size:15px;max-width:46ch}
.mapbox{position:relative;margin-top:26px;border-radius:var(--r);overflow:hidden;background:radial-gradient(70% 70% at 50% 55%,color-mix(in srgb,var(--accent) 10%,var(--bg)),var(--bg) 72%);border:1px solid var(--line)}
.mapbox canvas{display:block;width:100%;touch-action:pan-y;cursor:grab}
.mapbox canvas:active{cursor:grabbing}
.g-hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
@media(max-width:600px){.mapbox{margin-inline:calc(-1 * var(--gut));border-radius:0;border-inline:0}}
.places{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.place{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;color:var(--muted);transition:.2s}
.place i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.place.home{color:var(--ink);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.place:hover,.place.on{color:var(--ink);border-color:var(--accent)}

/* ---------- worlds ---------- */
.world{--w-bg:#5A1D10;--w-ink:#FBEBD3;--w-soft:color-mix(in srgb,var(--w-ink) 62%,var(--w-bg));--w-line:color-mix(in srgb,var(--w-ink) 20%,transparent);--w-card:color-mix(in srgb,var(--w-ink) 10%,var(--w-bg));
  position:relative;color:var(--w-ink);padding:0 0 64px;margin-top:64px}
.w-bgl{position:absolute;inset:0;background:var(--w-bg);overflow:hidden;clip-path:inset(0 5% round 32px);transition:clip-path .9s cubic-bezier(.2,.8,.2,1)}
.world.open .w-bgl{clip-path:inset(0 0 round 0)}
.world.gray{--w-bg:#0D0C11;--w-ink:#ECEAF2;--w-card:#16151C}
.world.gray .w-bgl::before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.55;
  background:radial-gradient(40% 30% at 20% 30%,rgba(78,140,120,.35),transparent 70%),radial-gradient(35% 28% at 80% 20%,rgba(140,90,120,.32),transparent 70%),radial-gradient(45% 35% at 60% 85%,rgba(90,110,160,.3),transparent 70%);
  filter:blur(30px);animation:slick 18s ease-in-out infinite alternate}
@keyframes slick{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}
.world>*:not(.w-bgl){position:relative}
.world+.world{margin-top:72px}
.world{scroll-margin-top:calc(var(--head) + 44px)}
.w-pill{display:flex;align-items:center;gap:12px;margin:0 auto;width:max-content;max-width:calc(100% - 36px);transform:translateY(-50%);
  background:var(--w-bg);border:1px solid var(--w-line);border-radius:18px;padding:8px 18px 8px 8px;box-shadow:0 14px 40px -18px rgba(0,0,0,.7)}
.w-pill img,.w-pill .wm{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--w-card)}
.w-pill b{display:block;font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.w-pill b small{font-family:var(--fb);font-weight:500;font-size:15px;opacity:.75;margin-left:6px}
.w-pill span{display:block;font-size:12.5px;color:var(--w-soft)}
.w-tag{text-align:center;max-width:40ch;margin:0 auto;padding:0 20px;color:var(--w-soft);font-size:15px}
.cf{margin-top:26px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cf::-webkit-scrollbar{display:none}
.cf-track{display:flex;gap:14px;padding:18px calc(50% - var(--cw)/2) 22px;--cw:min(64vw,300px);width:max-content}
.sl{flex:none;width:var(--cw);scroll-snap-align:center;border-radius:20px;overflow:hidden;background:var(--w-card);text-align:left;
  transform:scale(var(--s,1));opacity:var(--o,1);transition:transform .12s linear,opacity .12s linear,box-shadow .3s;will-change:transform}
.sl.mid{box-shadow:0 26px 60px -24px rgba(0,0,0,.8)}
.sl .im{display:block;aspect-ratio:4/5;overflow:hidden;background:color-mix(in srgb,var(--w-ink) 6%,var(--w-bg))}
.sl .im img{width:100%;height:100%;object-fit:cover}
.sl .cap{display:block;padding:14px 16px 16px}
.sl .cap b{display:block;font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl .cap span{display:block;margin-top:6px;font-size:12.5px;color:var(--w-soft)}
.sl.stat{display:flex;flex-direction:column;justify-content:center;gap:14px;aspect-ratio:4/5;padding:24px;background:color-mix(in srgb,var(--w-ink) 7%,var(--w-bg));border:1px solid var(--w-line)}
.sl.stat .n{font-size:clamp(40px,12vw,58px);line-height:.95;color:var(--w-ink)}
.sl.stat b{font-weight:600;font-size:16px}
.sl.stat span{display:block;margin-top:4px;font-size:13px;color:var(--w-soft)}
.world.gray .sl{border-radius:6px;background:#15141A;border:1px solid rgba(236,234,242,.14);padding:10px}
.world.gray .sl .im{border-radius:2px}
.world.gray .sl .cap{padding:10px 4px 2px}
.world.gray .sl .no{display:block;padding:10px 4px 0;font-size:11px;letter-spacing:.06em;color:var(--w-soft)}
.world.gray .sl .cap b{font-family:var(--fd);font-weight:700;letter-spacing:-.01em}
.world.gray .sl.stat{padding:22px}
.cf-ctl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:4px}
.cf-ctl button{width:40px;height:40px;border-radius:50%;border:1px solid var(--w-line);display:grid;place-items:center;color:var(--w-ink)}
.cf-ctl button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.count{min-width:64px;text-align:center;font-size:13px;font-weight:500;color:var(--w-soft);font-variant-numeric:tabular-nums}
.sl.end{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:4/5;padding:24px;text-align:center;border:1px solid var(--w-line);background:color-mix(in srgb,var(--w-ink) 7%,var(--w-bg))}
.sl.end img{width:84px;height:84px;border-radius:22px;object-fit:cover}
.sl.end b{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-top:6px}
.sl.end span{font-size:14px;color:var(--w-soft)}
.sl.end em{font-style:normal;margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--w-ink);color:var(--w-bg);font-size:14px;font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--w-line);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--w-ink)}
.w-socs{display:flex;gap:4px;margin:26px auto 0;width:max-content;max-width:calc(100% - 36px);flex-wrap:wrap;justify-content:center;
  background:color-mix(in srgb,var(--w-ink) 8%,var(--w-bg));border:1px solid var(--w-line);border-radius:16px;padding:6px}
.w-socs a{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--w-ink);opacity:.85;transition:.2s}
.w-socs a:hover{opacity:1;background:color-mix(in srgb,var(--w-ink) 12%,transparent)}
.w-socs svg{width:17px;height:17px;fill:currentColor}
.w-go{display:block;width:max-content;margin:18px auto 0;font-size:14px;font-weight:500;color:var(--w-soft);border-bottom:1px solid var(--w-line)}
.w-go:hover{color:var(--w-ink)}

/* ---------- before / after ---------- */
.ba-g{display:grid;gap:20px;grid-template-areas:"top" "img" "side"}
.ba-top{grid-area:top}.ba-im{grid-area:img}.ba-side{grid-area:side}
@media(min-width:820px){.ba-g{grid-template-columns:minmax(0,440px) minmax(0,1fr);grid-template-areas:"img top" "img side";grid-template-rows:1fr 1fr;column-gap:64px;row-gap:0}.ba-top{align-self:end}.ba-side{align-self:start;padding-top:18px}}
.ba{--p:92%;position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#fff;border:1px solid var(--line-2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;isolation:isolate}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.ba-b{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p)) 0 0);background:#fff}
.ba-t{position:absolute;top:12px;z-index:2;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;white-space:nowrap;transition:opacity .2s}
.ba-t.l{left:12px;background:#111;color:#fff}
.ba-t.r{right:12px;background:var(--accent);color:#fff}
.ba-l{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.18),0 0 18px rgba(0,0,0,.25);z-index:3;pointer-events:none}
.ba-h{position:absolute;top:50%;left:var(--p);z-index:4;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 22px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.9);cursor:grab;outline:none}
.ba-h svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ba-h:focus-visible{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.ba.drag .ba-h{cursor:grabbing;transform:scale(1.08)}
.ba-hint{position:absolute;left:var(--p);top:calc(50% + 34px);transform:translateX(-50%);z-index:2;font-size:12px;font-weight:500;color:#111;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .3s;pointer-events:none}
.ba.used .ba-hint{opacity:0}
.ba-top h3{font-family:var(--fd);font-weight:800;font-size:clamp(30px,7.4vw,48px);letter-spacing:-.03em;line-height:1.05}
.ba-say{min-height:3em;color:var(--muted);font-size:16px;line-height:1.5;max-width:40ch;transition:opacity .2s}
.ba-say b{color:var(--ink);font-weight:600}
.ba-io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.ba-io > div{padding:14px 16px;border-radius:14px;background:var(--surf-2);border:1px solid var(--line);transition:border-color .25s,background .25s}
.ba-io small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ba-io span{display:block;margin-top:6px;font-size:14px;line-height:1.45}
.ba-io > div.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--surf-2))}
.ba-side .acts{margin-top:20px}
.ba-cr{display:block;margin-top:14px;font-size:12px;color:var(--muted)}
.ba-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ba-tabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:500;color:var(--muted)}
.ba-tabs button.on{background:var(--surf-2);color:var(--ink);border-color:var(--accent)}

/* ---------- what I do (bento) ---------- */
.bn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:820px){.bn{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(200px,auto)}}
.bt{position:relative;overflow:hidden;border-radius:18px;background:var(--surf);border:1px solid var(--line);min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;color:var(--ink)}
.bt.full,.bt.strip{grid-column:1/-1}
.bt{container-type:inline-size}
.bt.hero{grid-column:1/-1;min-height:clamp(300px,82vw,420px)}
@media(min-width:820px){.bt.hero{grid-column:span 2;grid-row:span 2;min-height:420px}.bt.full{grid-column:span 2}.bt.strip{grid-column:1/-1;min-height:170px}}
.bt .md{position:absolute;inset:0;z-index:-1}
.bt .md img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.2s ease,transform 6s linear}
.bt .md img.on{opacity:1;transform:scale(1)}
.bt.has-md{color:#fff;border-color:transparent}
.bt.has-md::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.78))}
.bt .bd{padding:18px}
.bt .ct{display:block;font-size:clamp(40px,11vw,64px);line-height:.95;color:var(--accent)}
.bt.has-md .ct{color:#fff}
.bt .bd b{display:block;font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.bt .bd span.l{display:block;margin-top:5px;font-size:13px;line-height:1.45;opacity:.78}
.bt .wh{position:absolute;top:14px;left:14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bt:not(.has-md) .wh{background:var(--surf-2);color:var(--muted)}
.bt .dots2{position:absolute;top:18px;right:14px;display:flex;gap:4px}
.bt .dots2 i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:width .3s,background .3s}
.bt .dots2 i.on{width:16px;background:#fff}
.bt .fl{flex:1;display:grid;place-items:center;padding:18px 18px 0;min-height:120px}
.bt .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media(max-width:819px){.bt:not(.full):not(.strip):not(.hero) .chips{display:none}}
.bt:not(.hero) .md img{height:118%;object-position:50% 0}
.bt .chips i{font-style:normal;font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
/* product shot inside the viewfinder */
.bt .shot{position:relative;width:100%;max-width:220px;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#fff}
.bt .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 70%;transform:scale(1.45);transform-origin:50% 68%;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.bt.vf.z .shot img{transform:scale(1.25)}
/* brand logos as app icons */
.bt .apps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.bt .app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bt .app span{width:100%;max-width:64px;aspect-ratio:1;border-radius:22%;overflow:hidden;display:grid;place-items:center;background:var(--surf-2);border:1px solid var(--line-2);font-family:var(--fd);font-weight:800;font-size:20px;color:var(--ink);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.bt .app span img{width:100%;height:100%;object-fit:cover}
.bt .app small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bt .app:hover span{transform:translateY(-4px)}
.bt.in-view .app span{animation:pop .5s cubic-bezier(.2,.8,.2,1.3) both;animation-delay:calc(var(--k) * 90ms)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* line art */
.bt .art{width:min(150px,60%);height:auto;color:var(--accent)}
.bt .art path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bt .art .sw{stroke-dasharray:3 4;opacity:.7}
.bt.in-view .art .ln{stroke-dasharray:600;stroke-dashoffset:600;animation:drawl 1.8s ease forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
@media(min-width:820px){.bt.strip{flex-direction:row;align-items:center}.bt.strip .fl{flex:0 0 42%;min-height:170px;padding:18px}.bt.strip .bd{flex:1}}
/* viewfinder */
.bt.vf .fl{position:relative}
.bt.vf .fl::before{content:"";position:absolute;inset:14px 14px 0;background:
 linear-gradient(var(--ink),var(--ink)) 0 0/18px 2px,linear-gradient(var(--ink),var(--ink)) 0 0/2px 18px,
 linear-gradient(var(--ink),var(--ink)) 100% 0/18px 2px,linear-gradient(var(--ink),var(--ink)) 100% 0/2px 18px,
 linear-gradient(var(--ink),var(--ink)) 0 100%/18px 2px,linear-gradient(var(--ink),var(--ink)) 0 100%/2px 18px,
 linear-gradient(var(--ink),var(--ink)) 100% 100%/18px 2px,linear-gradient(var(--ink),var(--ink)) 100% 100%/2px 18px;background-repeat:no-repeat;opacity:.55}
.bt.vf .rec{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.bt.vf .rec i{width:7px;height:7px;border-radius:50%;background:#E5484D;animation:blink 1.2s steps(2) infinite}
.bt.vf::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.bt.vf.flash::after{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}
@keyframes blink{50%{opacity:.2}}
/* stitch */
.bt.st::before{content:"";position:absolute;inset:8px;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:12px;pointer-events:none;background-size:0}

/* ---------- reviews wall ---------- */
.wl-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wl-f button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:500;color:var(--muted)}
.wl-f button.on{color:var(--ink);background:var(--surf-2);border-color:var(--accent)}
.wl-f button i{font-style:normal;opacity:.6;margin-left:4px}
.wl-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:620px){.wl-g{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:900px){.wl-g{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}}
.wt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf-2);border:2px solid var(--tc,var(--line-2));transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s;cursor:zoom-in;padding:0}
.wt img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.wt::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.wt b{position:absolute;left:6px;bottom:6px;z-index:1;font-size:10px;font-weight:600;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:var(--tc);color:#fff;max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt:hover,.wt:focus-visible{transform:scale(1.06) rotate(-1.5deg);z-index:2;box-shadow:0 14px 30px -12px rgba(0,0,0,.7);outline:none}
.wt:nth-child(even):hover{transform:scale(1.06) rotate(1.5deg)}
.wl-more{margin-top:14px;width:100%;min-height:48px;border-radius:14px;border:1px dashed var(--line-2);font-size:14px;font-weight:500;color:var(--muted)}
.lbx{position:fixed;inset:0;z-index:300;background:#08080A;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.lbx.on{display:flex}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-size:13px;padding:0 4px 10px}
.lb-top b{font-weight:600}
.lb-top span{opacity:.6;margin-left:8px}
.lbx button{color:#fff}
.lb-x,.lb-n,.lb-p{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px;flex:none}
.lb-im{flex:1;min-height:0;display:grid;place-items:center;overflow:auto;touch-action:pan-y}
.lb-im img{max-width:min(100%,560px);max-height:100%;object-fit:contain;border-radius:10px}
.lb-nav{display:flex;justify-content:center;gap:14px;padding-top:12px}

/* ---------- inside a world ---------- */
.sl.door{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;aspect-ratio:4/5;padding:24px;text-align:center;border:1px dashed var(--w-line);background:transparent;cursor:pointer}
.sl.door .ar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--w-ink);color:var(--w-bg);font-size:24px;animation:nudge 1.6s ease-in-out infinite}
.sl.door b{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.02em}
.sl.door span{font-size:13px;color:var(--w-soft);max-width:22ch}
@keyframes nudge{50%{transform:translateX(8px)}}
.deep{position:fixed;inset:0;z-index:250;background:var(--w-bg);color:var(--w-ink);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.deep.on{transform:none;visibility:visible}
.deep.world{margin:0;padding:0}
.deep .dp-bar{position:sticky}
.dp-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--w-bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--w-line)}
.dp-bar img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.dp-bar b{flex:1;font-family:var(--fd);font-weight:700;font-size:16px}
.dp-bar button{width:40px;height:40px;border-radius:50%;border:1px solid var(--w-line);display:grid;place-items:center;color:var(--w-ink);font-size:18px}
.dp-in{max-width:620px;margin:0 auto;padding:34px 20px 60px}
.dp-in h2{font-family:var(--fd);font-weight:800;font-size:clamp(32px,8vw,52px);letter-spacing:-.03em;line-height:1.02}
.dp-in>p{margin-top:12px;color:var(--w-soft);font-size:16px;line-height:1.55}
.dp-st{margin-top:34px;display:grid;gap:34px;counter-reset:st}
.dp-s{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.dp-s .k{grid-row:span 2;font-size:15px;font-weight:600;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--w-line)}
.dp-s b{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2;padding-top:7px}
.dp-s p{color:var(--w-soft);font-size:15px;line-height:1.6}
.dp-s img{grid-column:1/-1;width:100%;border-radius:16px;margin-top:10px;background:var(--w-card)}
.dp-end{margin-top:44px;display:flex;flex-wrap:wrap;gap:10px}
.dp-end a,.dp-end button{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid var(--w-line);color:var(--w-ink)}
.dp-end a{background:var(--w-ink);color:var(--w-bg);border-color:var(--w-ink)}
html.dp-lock{overflow:hidden}
.dp-story{margin-top:26px;position:relative}
.dp-fw{position:sticky;top:calc(64px + env(safe-area-inset-top));z-index:3;background:var(--w-bg);margin:0 -20px;padding:0 20px 12px}
.dp-frame{position:relative;width:min(100%,calc(40vh * .75));margin:0 auto;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:#F3EBDD;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.dp-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.03);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.dp-frame img.on{opacity:1;transform:none}
.dp-frame .k{position:absolute;top:10px;left:10px;z-index:2;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#5A1D10;color:#FBEBD3;font-size:14px}
.dp-steps{position:relative;z-index:2}
.dp-step{min-height:75vh;padding-top:14px}
.dp-card{position:sticky;top:calc(80px + 40vh + env(safe-area-inset-top))}
.dp-step:first-child{padding-top:24px}
.dp-card{background:color-mix(in srgb,var(--w-bg) 92%,#000);border:1px solid var(--w-line);border-radius:16px;padding:18px 18px 20px;transition:opacity .4s,transform .4s;opacity:.45;transform:translateY(10px)}
.dp-step.on .dp-card{opacity:1;transform:none}
.dp-card small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--w-soft)}
.dp-card b{display:block;margin-top:6px;font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.02em;line-height:1.2}
.dp-card p{margin-top:8px;color:var(--w-soft);font-size:15px;line-height:1.6}
.dp-step:last-child{min-height:52vh}
.deep .dp-bar{z-index:4}
@media(min-width:820px){.dp-card{position:static}.dp-in.wide{max-width:980px}.dp-story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}.dp-fw{top:96px;align-self:start;margin:0;padding:0;background:none}.dp-frame{width:100%;margin:0}.dp-step{min-height:70vh;display:flex;align-items:center}.dp-step:first-child{padding-top:0}}
.lv{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.lv i{width:8px;height:8px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 0 rgba(61,214,140,.6);animation:pulse 1.8s infinite}
.lv .lvn{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}

/* more pages */
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.op{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 18px}
.op .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surf-2);color:var(--muted)}
.op .ic svg{width:16px;height:16px;fill:currentColor}
.op .nm{flex:1;min-width:0;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .go{width:32px;height:32px}

/* drops + journal */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(74vw,272px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.dr{scroll-snap-align:start}
.dr .md{position:relative;display:block;aspect-ratio:4/5;background:var(--surf-2);overflow:hidden}
.dr .md img,.dr .md video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dr .kind{position:absolute;left:12px;top:12px;z-index:1;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent)}
.dr .cp{display:block;padding:16px 18px 18px}
.dr .cp b{display:block;font-family:var(--fd);font-weight:700;font-size:17px}
.dr .cp span{display:block;margin-top:4px;color:var(--muted);font-size:13.5px}
.jr{padding:24px}.jr .d{font-size:13px;font-weight:500;color:var(--accent)}
.jr h3{font-family:var(--fd);font-weight:700;font-size:19px;margin-top:6px}.jr p{color:var(--muted);font-size:14px;margin-top:6px}

/* arcade */
.game{padding:24px}
.game-h{margin-bottom:18px}
.game-h b{display:block;font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:-.02em}
.game-h span{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);transition:.2s}
.pick i.ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px}
.pick svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pick b{display:block;font-size:14px;font-weight:500;color:var(--ink);line-height:1.2}
.pick em{display:block;font-style:normal;font-size:12px;margin-top:2px}
.pick:hover,.pick.on{border-color:var(--accent);color:var(--accent)}
.pick.on{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.pick.on b{color:var(--accent)}
.pick.wide{grid-column:1/-1;min-height:80px;padding:14px 18px;gap:14px;position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%)}
.pick.wide i.ic{width:46px;height:46px;border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pick.wide svg{width:22px;height:22px}
.pick.wide b{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;color:var(--accent)}
.pick.wide em{color:var(--muted)}
.ext-t{flex:1;min-width:0}.ext-r{display:flex;align-items:center;gap:10px;flex:none;position:relative;z-index:1}
.demo{font-size:12px;font-weight:600;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:6px 12px;line-height:1}
.host{font-size:12px;color:var(--muted);white-space:nowrap}
@media(max-width:540px){.host{display:none}}
.pick.wide::after{content:"";position:absolute;inset:0;pointer-events:none;translate:-110% 0;background:linear-gradient(105deg,transparent 42%,color-mix(in srgb,var(--accent) 22%,transparent) 50%,transparent 58%);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,74%{translate:-110% 0}90%,100%{translate:110% 0}}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--accent) 4%,var(--bg));touch-action:none;cursor:grab}
.stage canvas{display:block;width:100%;height:300px}
.hud{position:absolute;inset-inline:0;top:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:12px;font-weight:500;color:var(--muted);pointer-events:none}
.hud b{color:var(--accent);font-weight:600}.hud i{font-style:normal}
.ovl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.ovl.off{display:none}
.ovl h4{font-family:var(--fd);font-weight:800;font-size:clamp(22px,5vw,30px);letter-spacing:-.03em}
.ovl p{color:var(--muted);font-size:14px;margin-top:6px;max-width:34ch}
.ovl .btn{margin-top:18px}

/* closing */
.end h2{font-family:var(--fd);font-weight:800;font-size:clamp(44px,11vw,92px);letter-spacing:-.045em;line-height:.9}
.end p{margin-top:14px;color:var(--muted);font-size:17px;max-width:44ch}
.mail{margin-top:24px;font-size:clamp(17px,3.4vw,22px);font-weight:500;border-bottom:1px solid var(--line-2);padding-bottom:2px;display:inline-block;word-break:break-all}
.mail:hover{color:var(--accent);border-color:var(--accent)}
footer{border-top:1px solid var(--line);padding:22px 0 calc(22px + env(safe-area-inset-bottom));color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.modal.on{display:grid}
.mc{background:var(--surf);border:1px solid var(--line-2);border-radius:var(--r);padding:28px;text-align:center;max-width:340px;width:100%}
.mc h3{font-family:var(--fd);font-weight:700;font-size:20px;margin-bottom:18px}
.mc img{width:100%;max-width:230px;margin:0 auto 14px;background:#fff;padding:12px;border-radius:10px}
.mc p{font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:18px}
.toast{position:fixed;inset-inline:0;bottom:calc(24px + env(safe-area-inset-bottom));margin-inline:auto;width:max-content;z-index:200;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}

.js .rv{opacity:0;transform:translateY(14px)}
.js .rv.in{opacity:1;transform:none;transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .rv,.js .rv.in{opacity:1;transform:none;transition:none}
  .bt .md img,.bt.vf .rec i,.bt .app span,.bt .art .ln,.lv i,.sl.door .ar,.ba-hint,.dot.live,.pick.wide::after,.world.gray .w-bgl::before{animation:none}
  .w-bgl{clip-path:none!important;transition:none}
  .fill{transition:none}
  *{transition-duration:.01ms!important}
  .wt:hover,.wt:focus-visible{transform:none}
}

/* ================= v10: studio, full house, in motion, el partyta, high scores ================= */
.x-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;border:1px solid var(--accent);transition:transform .2s,filter .2s}
.x-btn:hover{filter:brightness(1.07)}.x-btn:active{transform:scale(.98)}
.x-btn.ghost{background:none;color:var(--ink);border-color:var(--line-2)}
.x-btn[disabled]{opacity:.35;pointer-events:none}
.x-chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;font-size:13.5px;white-space:nowrap;transition:.2s}
.x-chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.x-chip[hidden],.x-back[hidden],.x-btn[hidden]{display:none!important}
.x-swap{animation:xsw .35s ease}@keyframes xsw{from{opacity:.2;transform:translateY(6px)}}

/* shared 3D window */
.x-v3{position:relative;height:min(92vw,400px);border-radius:var(--r);overflow:hidden;background:#0d0c12;border:1px solid var(--line);touch-action:pan-y}
.x-v3 canvas{width:100%;height:100%;display:block;cursor:grab}
.x-v3 canvas:active{cursor:grabbing}
.x-hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:#b9b1aa;pointer-events:none;letter-spacing:.04em}
.x-back{position:absolute;left:10px;top:10px;min-height:38px;padding:0 13px;border-radius:999px;background:#141216cc;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff33;color:#F3EEE9;font-size:13px}
.x-load{position:absolute;inset:0;display:grid;place-items:center;color:#9C948F;font-size:13px;pointer-events:none;transition:opacity .5s}
.x-v3.ready .x-load{opacity:0}
.x-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.x-pins button{position:absolute;left:0;top:0;pointer-events:auto;transition:opacity .3s;will-change:transform}
.x-pins .off{opacity:0;pointer-events:none}
.x-pin{background:#141216b3;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #ffffff3a;border-radius:10px;padding:6px 9px;font:600 9.5px/1.1 var(--fb);letter-spacing:.08em;color:#F3EEE9;white-space:nowrap}
.x-hot{width:30px;height:30px;border-radius:50%}
.x-hot::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#E07848;box-shadow:0 0 0 2px #fff}
.x-hot::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px solid #E07848;animation:xpg 1.8s ease-out infinite}
.x-hot.sel::before{background:#fff;box-shadow:0 0 0 2px #E07848}
@keyframes xpg{from{transform:scale(.5);opacity:1}to{transform:scale(1.5);opacity:0}}

/* studio */
.x-st{display:grid;gap:16px}
.x-rooms{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut)}
.x-rooms::-webkit-scrollbar{display:none}
.x-side{display:grid;gap:16px;min-width:0;align-content:start}
.x-shot{position:relative;margin:0;border-radius:var(--r);overflow:hidden;background:var(--surf-2);border:1px solid var(--line)}
.x-shot img{position:relative;width:100%;aspect-ratio:16/10;object-fit:contain;display:block}
.x-shot figcaption{position:relative;padding:10px 14px 11px;background:var(--surf);color:var(--ink);font-size:13px;line-height:1.35;border-top:1px solid var(--line)}
.x-got h3{font-family:var(--fd);font-size:22px;letter-spacing:-.02em;line-height:1.15;margin-bottom:8px}
.x-got ul{list-style:none;color:var(--muted);font-size:14.5px;display:grid;gap:3px}.x-got li::before{content:"→ ";color:var(--accent)}
.x-with{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.x-with span{border:1px solid var(--line-2);border-radius:999px;padding:4px 10px}.x-with b{font-weight:400;margin-right:2px}
.x-proof{border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:baseline;gap:12px}
.x-proof .n{font-size:28px;color:var(--accent)}.x-proof span{color:var(--muted);font-size:13.5px}
@media(min-width:900px){.x-st{grid-template-columns:1.35fr 1fr;align-items:start}.x-st .x-rooms{grid-column:1/-1;margin:0;padding:0}.x-v3{height:480px}}

/* full house */
.x-fh{display:grid;gap:16px}
.x-steps{display:flex;justify-content:space-between;align-items:center;position:relative}
.x-steps::before{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:1px dashed var(--line-2)}
.x-steps button{position:relative;width:34px;height:34px;border-radius:50%;border:1.4px solid var(--line-2);background:var(--bg);font:700 12px/1 var(--fn);transition:.25s}
.x-steps button.done{background:#F0C04A;border-color:#F0C04A;color:#1a0d06}
.x-steps button.cur{outline:2px solid var(--accent);outline-offset:2px}
.x-hinfo{display:grid;gap:6px;min-height:104px;align-content:start}
.x-hinfo small{color:var(--accent);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.x-hinfo h3{font-family:var(--fd);font-size:24px;letter-spacing:-.02em;line-height:1.1}.x-hinfo p{color:var(--muted);font-size:14.5px}
.x-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(min-width:900px){.x-fh{grid-template-columns:1.35fr 1fr;align-items:start}}

/* in motion */
.x-mv{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;max-width:520px;margin-inline:auto}
.x-mv.wide{grid-template-columns:minmax(0,1fr);max-width:760px}
.x-screen{position:relative;aspect-ratio:9/16;width:100%;border-radius:18px;overflow:hidden;background:#120f12;border:1px solid var(--line);align-self:start;padding:0;display:block}
.x-mv.wide .x-screen{aspect-ratio:16/9}
.x-screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.x-screen .tc{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;font:600 11px var(--fn);color:#fff;text-shadow:0 1px 6px #000a}
.x-screen .tc i{font-style:normal;color:#ff5a4d}
.x-screen .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 14px 13px;background:linear-gradient(transparent,#0B0A0Cdd);text-align:left;color:#fff}
.x-screen .cap b{font:700 18px/1.15 var(--fd);display:block}.x-screen .cap span{font-size:12px;color:#d9d0c9}
.x-screen .pl{position:absolute;left:50%;top:50%;translate:-50% -50%;width:58px;height:58px;border-radius:50%;border:1.5px solid #fff;background:#0006;display:grid;place-items:center;color:#fff;transition:opacity .25s}
.x-screen.playing .pl{opacity:0}
.x-strip{display:flex;flex-direction:column;gap:8px;min-width:0;overflow-y:auto;scrollbar-width:none;position:relative}
.x-strip::-webkit-scrollbar{display:none}
.x-mv:not(.wide) .x-strip{position:absolute;inset:0}
.x-stripw{position:relative;min-width:0}
.x-mv.wide .x-strip{flex-direction:row;overflow-x:auto;overflow-y:hidden}
.x-strip button{position:relative;flex:none;aspect-ratio:9/13;border-radius:10px;border:1.5px solid var(--line);overflow:hidden;background:var(--surf-2) center/cover;padding:0}
.x-mv.wide .x-strip button{width:74px}
.x-strip button.w{aspect-ratio:16/11}
.x-mv.wide .x-strip button.w{width:118px;aspect-ratio:auto}
.x-strip button span{position:absolute;left:0;right:0;bottom:0;padding:14px 5px 4px;font-size:9.5px;line-height:1.15;text-align:left;color:#fff;background:linear-gradient(transparent,#000c)}
.x-strip button[aria-pressed=true]{border-color:var(--accent)}
.x-mvn{max-width:520px;margin:12px auto 0;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--muted);font-size:13px}
.x-mv.wide + .x-mvn{max-width:760px}

/* el partyta */
.x-ep{--g:#141414;--c:#262626;--gold:#F0C04A;--iv:#EEE6D0;--e:#3C3C3C;background:var(--g);border:1px solid var(--e);border-radius:22px;padding:20px 18px;display:grid;gap:18px;color:var(--iv)}
.x-eph{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center}
.x-eph>img{width:64px;height:64px;border-radius:15px}
.x-eph .wm{height:26px;width:auto;margin-bottom:5px}
.x-eph p{font-size:13px;color:#b9b2a2;line-height:1.4}
.x-epst{display:flex;gap:8px;flex-wrap:wrap}
.x-epst span{flex:1 1 30%;min-width:0;border:1px solid var(--e);border-radius:12px;padding:9px 10px;font-size:11.5px;color:#9A9A9A;line-height:1.3}
.x-epst b{display:block;font:800 16px var(--fn);color:var(--iv)}
.x-epg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.x-epg button{display:grid;justify-items:center;gap:6px;padding:10px 6px 9px;border-radius:14px;border:1.5px solid var(--e);background:var(--c);border-top:5px solid var(--k);color:var(--iv);transition:.2s}
.x-epg img{width:54px;height:54px;object-fit:contain}
.x-epg b{font:600 14px/1.25 var(--fb);direction:rtl}
.x-epg button[aria-pressed=true]{border-color:var(--gold);border-top-color:var(--k);background:#30302f}
.x-phone{position:relative;border:2px solid var(--e);border-radius:26px;background:var(--c);padding:16px 14px 0;min-height:250px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;text-align:center;overflow:hidden;direction:rtl}
.x-phone::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--k,#61AE37)}
.x-phone small{color:#9A9A9A;font-size:12.5px;margin-top:4px}
.x-phone .q{align-self:center;display:grid;gap:10px;justify-items:center;font:600 21px/1.5 var(--fb)}
.x-phone .q .n{font-size:44px;color:var(--gold);line-height:1}
.x-phone .q .lt{font:800 60px/1 var(--fb);color:var(--gold)}
.x-phone .cats,.x-phone .opts{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.x-phone .cats span{border:1px solid var(--e);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:400}
.x-phone .opts button{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--e);background:#1b1b1b;color:var(--iv);font:600 17px var(--fb)}
.x-phone .opts button.ok{border-color:#61AE37;background:#23331a}.x-phone .opts button.no{border-color:#CE7464;opacity:.6}
.x-phone .scr{font:600 30px/1.2 var(--fb);letter-spacing:.32em;color:var(--gold);padding-right:.32em}
.x-phone .x-go{margin:0 -14px;min-height:54px;background:var(--gold);color:#1a1405;font:700 16px var(--fb);direction:ltr}
.x-phone .tm{position:absolute;left:0;bottom:54px;height:4px;background:var(--gold);width:0}
.x-epf{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.x-soon{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--e);font-size:13px;color:var(--iv)}
.x-soon svg{width:18px;height:18px}
.x-soon.pop{animation:xpop .6s ease 2}@keyframes xpop{50%{border-color:var(--gold);box-shadow:0 0 0 4px #F0C04A33}}
.x-epf a{font-size:13.5px;color:var(--gold);min-height:44px;display:inline-flex;align-items:center}
@media(min-width:900px){.x-ep{grid-template-columns:1fr 1fr;padding:28px;column-gap:32px}.x-ep .x-phone{grid-column:2;grid-row:1/5;min-height:340px}.x-ep .x-epf{grid-column:1}}

/* high scores + tools rails */

let T, D2R = Math.PI / 180, MAT = {};
const WOOD = "#b98b62", DWOOD = "#6e5140", WHITE = "#efe9e2", DARK = "#2b2a2e", STEEL = "#8d9096", ACC = "#E07848";
const mat = (c, o = {}) => { const k = c + JSON.stringify(o); return MAT[k] || (MAT[k] = new T.MeshStandardMaterial(Object.assign({ color: c, roughness: .85, metalness: 0 }, o))); };
const glow = (c, i = 1.4) => new T.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: i, roughness: .4 });
function mesh(geo, m, x = 0, y = 0, z = 0, p) { const o = new T.Mesh(geo, typeof m === "string" ? mat(m) : m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; if (p) p.add(o); return o; }
const box = (p, w, h, d, m, x, y, z) => mesh(new T.BoxGeometry(w, h, d), m, x, y + h / 2, z, p);
const cyl = (p, r, h, m, x, y, z, r2, seg = 20) => mesh(new T.CylinderGeometry(r2 === undefined ? r : r2, r, h, seg), m, x, y + h / 2, z, p);
const sph = (p, r, m, x, y, z, det = 1) => mesh(new T.IcosahedronGeometry(r, det), m, x, y, z, p);
const grp = (p, x = 0, y = 0, z = 0, ry = 0) => { const g = new T.Group(); g.position.set(x, y, z); g.rotation.y = ry * D2R; p.add(g); return g; };
/* a straight rod between two points: legs, arms, tripod legs */

const I_DL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>';
const BRANDS = { m3anyi: "M3anyi", gray: "Gray Museum" };
const PLAT = { pinterest: "Pinterest", instagram: "Instagram", tiktok: "TikTok", youtube: "YouTube", facebook: "Facebook", linkedin: "LinkedIn", x: "X" };
const compact = v => v >= 1e6 ? (v / 1e6).toFixed(2).replace(/\.?0+$/, "") + "M" : v >= 1e3 ? (v >= 1e5 ? Math.round(v / 1e3) : (v / 1e3).toFixed(1).replace(/\.0$/, "")) + "K" : String(Math.round(v));
const splitUnit = s => { const m = String(s).match(/^([^A-Za-z%]*)([A-Za-z%]*)$/); return m ? `${m[1]}<span class="u">${m[2]}</span>` : esc(s); };

/* ---------- Brand X-ray content ---------- */
let D = null, AC = null;

function paint(d){
  D = d;
  const p = d.profile || {}, s = d.settings || {}, t = d.theme || {}, c = d.contact || {};
  const root = document.documentElement;
  root.dataset.theme = t.preset || "copper";
  root.style.removeProperty("--accent");
  if (t.accent) root.style.setProperty("--accent", t.accent);
  if (s.siteTitle) document.title = s.siteTitle;

  const secs = []; // [id, label, html, kind]
  const head = (title, note, count) => `<div class="sh rv"><h2>${esc(title)}${count ? `<sup>${count}</sup>` : ""}</h2>${note ? `<p>${esc(note)}</p>` : ""}</div>`;

  /* portfolios */
  const pf = d.portfolios;
  if (pf && on(pf.enabled) && live(pf.items).length){
    const items = live(pf.items);
    secs.push(["work", "Work", head(pf.title, pf.note, items.length) + `<div class="grid">` + items.map((i, k) => `
      <a class="card rv" href="${esc(i.url)}"${ext(i.url)}>
        <span class="cover"><span class="plate">${String(k + 1).padStart(2, "0")}</span>
          ${i.cover ? `<img src="${esc(i.cover)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
          ${i.tag ? `<span class="tag">${esc(i.tag)}</span>` : ""}</span>
        <span class="pf-b"><div><h3${arc(i.title)}>${esc(i.title)}</h3>${i.subtitle ? `<p${arc(i.subtitle)}>${esc(i.subtitle)}</p>` : ""}</div><span class="go">${ARROW}</span></span>
      </a>`).join("") + `</div>`]);
  }

  /* what I do */
  const sv = d.services;
  if (sv && on(sv.enabled) && live(sv.items).length){
    secs.push(["do", sv.nav || "Services", head(sv.title, sv.note) + `<div class="bn">` + live(sv.items).map((x, k) => {
      const imgs = x.images || [];
      const cls = ["bt", "rv", x.size || "", imgs.length || x.prefix ? "has-md" : "", x.deco === "viewfinder" ? "vf" : x.deco === "stitch" ? "st" : ""].filter(Boolean).join(" ");
      return `<div class="${cls}" data-svc="${k}">
        ${imgs.length || x.prefix ? `<span class="md">${imgs.map((s, i) => `<img src="${esc(s)}" alt=""${i ? "" : ' class="on"'} loading="lazy">`).join("")}</span><span class="dots2"></span>` : ""}
        ${x.where ? `<span class="wh">${esc(x.where)}</span>` : ""}
        ${x.deco === "viewfinder" ? `<span class="rec"><i></i>REC</span>` : ""}
        ${x.shot ? `<span class="fl"><span class="shot"><img src="${esc(x.shot)}" alt="" loading="lazy"></span></span>` : ""}
        ${(x.logos || []).length ? `<span class="fl"><span class="apps">${x.logos.map((l, i) => `<span class="app" style="--k:${i}"><span>${l.img ? `<img src="${esc(l.img)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${esc((l.name || "?")[0])}'))">` : esc((l.name || "?")[0])}</span><small>${esc(l.name)}</small></span>`).join("")}</span></span>` : ""}
        ${x.art === "tee" ? `<span class="fl"><svg class="art" viewBox="0 0 120 110" aria-hidden="true"><path class="ln" d="M42 8 L20 16 L6 38 L22 46 L28 38 L28 102 L92 102 L92 38 L98 46 L114 38 L100 16 L78 8 Q60 22 42 8 Z"/><path class="sw" d="M32 44 L32 98 L88 98 L88 44"/><path class="ln" d="M50 11 Q60 17 70 11"/><path class="sw" d="M66 40 L80 40 L80 52 L66 52 Z"/></svg></span>` : ""}
        <span class="bd">${x.count ? `<span class="ct n" data-ct="${esc(x.count)}">${esc(x.count)}</span>` : ""}<b>${esc(x.title)}</b>${x.line ? `<span class="l">${esc(x.line)}</span>` : ""}${(x.chips || []).length ? `<span class="chips">${x.chips.map(c => `<i>${esc(c)}</i>`).join("")}</span>` : ""}</span></div>`; }).join("") + `</div>`]);
  }

  /* results */
  const rs = d.results;
  if (rs && on(rs.enabled) && live(rs.items).length){
    secs.push(["results", "Results", head(rs.title, rs.note) + `<div class="res">` + live(rs.items).map(r => `
      <div class="card rc rv"><span class="who"><b>${esc(r.client)}</b>${esc(r.sector || "")}</span>
        <span class="n">${esc(r.value)}</span><span class="lb">${esc(r.label)}</span>${r.extra ? `<span class="ex">${esc(r.extra)}</span>` : ""}</div>`).join("") + `</div>`
      + (d.tools && on(d.tools.enabled) && live(d.tools.items).length ? `<div class="tb rv"><div class="tb-h"><b>${esc(d.tools.title || "Built in-house")}</b>${d.tools.note ? `<small>${esc(d.tools.note)}</small>` : ""}</div>
        <div class="tb-g">${live(d.tools.items).map(x => `<div class="tl"><i>${TOOLI[x.icon] || TOOLI.spark}</i><b>${esc(x.name)}</b>${x.kind ? `<small>${esc(x.kind)}</small>` : ""}</div>`).join("")}</div></div>` : "")]);
  }

  /* before / after */
  const ba = d.beforeAfter;
  if (ba && on(ba.enabled) && live(ba.items).length){
    const it = live(ba.items), f = it[0], wa = (c.whatsapp || "").replace(/\D/g, "");
    const L = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6-6 6 6 6M15 6l6 6-6 6"/></svg>';
    secs.push(["reveal", ba.nav || "Before/After", `<div class="ba-g">
      <div class="ba-top rv"><span class="kick" style="display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px">${esc(ba.kicker || "Before / After")}</span>
        <h3>${esc(ba.title || "Same product. New story.").replace(/\. /g, ".<br>")}</h3></div>
      <div class="ba-im rv">${it.length > 1 ? `<div class="ba-tabs">${it.map((x, k) => `<button data-bat="${k}"${k ? "" : ` class="on"`}>${esc(x.brand)}</button>`).join("")}</div>` : ""}
        <div class="ba" data-ba>
          <img class="ba-a" src="${esc(f.after)}" alt="${esc(f.brand)}: final campaign" onerror="this.style.visibility='hidden'">
          <div class="ba-b"><img src="${esc(f.before)}" alt="${esc(f.brand)}: raw product photo" onerror="this.style.visibility='hidden'"></div>
          <span class="ba-t l">${esc(ba.beforeLabel || "Before")}</span><span class="ba-t r">${esc(ba.afterLabel || "After")}</span>
          <span class="ba-l"></span>
          <span class="ba-h" role="slider" tabindex="0" aria-label="${esc(ba.aria || "Drag to compare before and after")}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="92">${L}</span>
          <span class="ba-hint">${esc(ba.hint || "Drag the circle")}</span>
        </div></div>
      <div class="ba-side rv">
        <p class="ba-say" aria-live="polite"></p>
        <div class="ba-io"><div data-io="b"><small>${esc(ba.sendLabel || "You send")}</small><span>${esc(f.send || "")}</span></div>
          <div data-io="a"><small>${esc(ba.getLabel || "You get")}</small><span>${esc(f.get || "")}</span></div></div>
        ${wa && ba.cta ? `<div class="acts"><a class="btn solid" href="https://wa.me/${wa}?text=${encodeURIComponent(ba.ctaMsg || "")}" target="_blank" rel="noopener">${esc(ba.cta)}${ARROW}</a></div>` : ""}
        <small class="ba-cr">${esc(f.credit || "")}</small>
      </div></div>`]);
  }

  /* numbers */
  const nb = liveNumbers(d.numbers);
  if (nb && on(nb.enabled) && live(nb.rows).length){
    const rows = live(nb.rows);
    const total = rows.reduce((a, r) => a + (+r.raw || 0), 0), max = Math.max(...rows.map(r => +r.raw || 0), 1);
    const used = [...new Set(rows.map(r => r.brand))];
    const chart = rows.map((r, k) => `
      <button class="rowb rv" aria-expanded="false" aria-label="${esc(BRANDS[r.brand] || r.brand)} ${esc(PLAT[r.platform] || r.platform)}: ${esc(r.value)} ${esc(r.label)}">
        <span class="rh"><span class="pi">${icon(r.platform)}</span>
          <span class="who"><small>${esc(BRANDS[r.brand] || r.brand)} · ${esc(PLAT[r.platform] || r.platform)} · ${esc(r.span || "")}</small><b class="n">${esc(r.value)}<em>${esc(r.label)}</em></b></span>
          <span class="chev">${CHEV}</span></span>
        <span class="track" style="display:block"><span class="fill" style="display:block;width:0;background:var(--c-${esc(r.brand)});--d:${k * 110}ms" data-w="${Math.max(2, (+r.raw || 0) / max * 100).toFixed(1)}"></span></span>
        <span class="more-d" style="display:grid"><span class="md-in"><span class="kv">${(r.growth ? `<span class="up">${esc(r.growth)} vs previous period</span>` : "") + (r.details || []).map(([k2, v]) => `<span>${esc(k2)} <b>${esc(v)}</b></span>`).join("")}</span></span></span>
      </button>`).join("");
    const tiles = (arr, cls) => live(arr).map(f => `<div class="card proof rv"><b class="n">${esc(f.value)}</b><span>${esc(f.label)}</span></div>`).join("");
    secs.push(["numbers", "Numbers", `<div class="sh rv" style="margin-bottom:0"><h2>${esc(nb.title)}</h2>${nb.note ? `<p>${esc(nb.note)}</p>` : ""}</div>
      <div class="ntop"><div class="total rv">${nb.period ? `<span class="period"><span class="dot"></span>${esc(nb.period)}</span>` : ""}
        <b class="n" id="bigN" data-to="${total}">${splitUnit(compact(total))}</b><p>${esc(nb.headline || "")}</p>${nb._live ? `<span class="lv" aria-live="off"><i></i><span>Live · <span class="lvn" id="lvN">+0</span> views today</span></span>` : ""}</div>
        ${nb.trend && on(nb.trend.enabled) && (nb.trend.series || []).length ? `<div class="card trend rv" id="trend">
          <div class="tr-h"><div><small id="trL"></small><b class="n" id="trV"></b></div>
            ${nb.trend.series.length > 1 ? `<div class="tabs2" role="tablist">${nb.trend.series.map((s, k) => `<button role="tab" data-tr="${k}"${k ? "" : ' class="on"'}>${esc(s.label.split("·").pop().trim())}</button>`).join("")}</div>` : ""}</div>
          <div class="tr-svg" id="trS"><svg id="trSvg" viewBox="0 0 300 150" preserveAspectRatio="none" role="img" aria-label="Daily views"></svg><div class="tr-tip" id="trTip"></div></div>
          <div class="tr-x"><span id="trA"></span><span id="trB"></span></div></div>` : ""}</div>
      <div class="legend" aria-hidden="true">${used.map(b => `<span><i class="sw" style="background:var(--c-${esc(b)})"></i>${esc(BRANDS[b] || b)}</span>`).join("")}<span style="margin-left:auto">Tap a row for details</span></div>
      <div class="chart" id="chart">${chart}</div>
      ${live(nb.proofs).length ? `<div class="proofs">${tiles(nb.proofs)}</div>` : ""}
      ${live(nb.results).length ? `<h3 class="sub-h rv">Client results</h3><div class="proofs" style="margin-top:14px">${tiles(nb.results)}</div>` : ""}
      <p class="src">Numbers from each platform's own insights. TikTok covers the last 60 days; everything else the last 90. The total is the sum of the rows. Daily lines are read from the insights charts.${nb._live ? ` ${esc(nb.live.note || "")}` : ""}</p>`]);
  }

  /* map */
  const mp = d.map;
  if (mp && on(mp.enabled) && live(mp.places).length){
    secs.push(["map", "Map", `<span class="period rv"><span class="dot"></span>${esc(mp.title || "Worldwide")}</span>
      <h2 class="map-h rv" style="margin-top:16px">${esc(mp.headline || "")}</h2>${mp.note ? `<p class="map-p rv">${esc(mp.note)}</p>` : ""}
      <div class="mapbox rv"><span class="g-hint">Drag to spin</span><canvas id="mapc" aria-label="Map of countries I have worked in: ${esc(live(mp.places).map(x => x.name).join(", "))}"></canvas></div>
      <div class="places">${live(mp.places).map(x => `<button class="place${x.id === mp.home ? " home" : ""}" data-pl="${esc(x.id)}"><i></i>${esc(x.name)}${x.id === mp.home ? " · home base" : ""}</button>`).join("")}</div>`]);
  }

  /* worlds */
  const wd = d.worlds;
  const worldHTML = [];
  if (wd && on(wd.enabled)){
    live(wd.items).forEach(w => {
      worldHTML.push([w.id, w.name, `<section class="world ${esc(w.skin || "")}" id="${esc(w.id)}" data-nav data-tint data-world="${esc(w.id)}"><div class="w-bgl"></div>
        <div class="w-pill">${w.logo ? `<img src="${esc(w.logo)}" alt="" onerror="this.remove()">` : `<span class="wm"></span>`}
          <span><b>${esc(w.name)}${w.arabic ? `<small dir="rtl">${esc(w.arabic)}</small>` : ""}</b><span>${esc(w.role || "")}</span></span></div>
        ${w.tagline ? `<p class="w-tag"${arc(w.tagline)}>${esc(w.tagline)}</p>` : ""}
        <div class="cf" data-cf><div class="cf-track">${trackHTML(w, [])}</div></div>
        <div class="cf-ctl"><button data-prev aria-label="Previous">${PREV}</button><span class="count" aria-live="polite"></span><button data-next aria-label="Next">${NEXT}</button></div>
        <div class="w-socs">${(w.socials || []).map(x => `<a href="${esc(x.url)}"${ext(x.url)} aria-label="${esc(w.name)} on ${esc(x.net)}">${icon(x.net)}</a>`).join("")}</div>
      </section>`]);
    });
  }

  /* reviews wall */
  const wl = d.wall;
  if (wl && on(wl.enabled) && live(wl.sources).length){
    secs.push(["wall", wl.nav || "Reviews", `<div data-wall hidden>` + head(wl.title, wl.note) + `<div class="wl-f"></div><div class="wl-g"></div><button class="wl-more" hidden></button></div>`]);
  }

  /* drops */
  const dr = d.drops;
  if (dr && on(dr.enabled, false) && live(dr.items).length){
    secs.push(["latest", "Latest", head(dr.title, dr.note) + `<div class="rail">` + live(dr.items).slice(0, 8).map(i => `
      <a class="card dr" href="${esc(i.url || "#")}"${ext(i.url)}><span class="md"><span class="kind">${i.type === "video" ? "Video" : "Post"}</span>
        ${i.type === "video" && i.media ? `<video muted playsinline loop preload="none" ${i.poster ? `poster="${esc(i.poster)}"` : ""} src="${esc(i.media)}"></video>` : i.media ? `<img src="${esc(i.media)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</span>
        <span class="cp"><b${arc(i.title)}>${esc(i.title)}</b>${i.caption ? `<span${arc(i.caption)}>${esc(i.caption)}</span>` : ""}</span></a>`).join("") + `</div>`]);
  }

  /* more pages */
  const op = d.otherPages;
  if (op && on(op.enabled) && live(op.items).length){
    secs.push(["more", "More", head(op.title, op.note) + `<div class="list">` + live(op.items).map(i => `
      <a class="card op rv" href="${esc(i.url)}"${ext(i.url)}><span class="ic">${icon(i.net || "instagram") || icon("link")}</span>
        <span class="nm"${arc(i.name)}>${esc(i.name)}</span><span class="go">${ARROW}</span></a>`).join("") + `</div>`]);
  }

  /* journal */
  const jr = d.journal;
  if (jr && on(jr.enabled, false) && live(jr.items).length){
    secs.push(["journal", "Journal", head(jr.title, jr.note) + `<div class="grid">` + live(jr.items).map(i => `
      <a class="card jr rv" href="${esc(i.url || "#")}"${ext(i.url)}>${i.date ? `<span class="d">${esc(i.date)}</span>` : ""}<h3${arc(i.title)}>${esc(i.title)}</h3>${i.excerpt ? `<p${arc(i.excerpt)}>${esc(i.excerpt)}</p>` : ""}</a>`).join("") + `</div>`]);
  }

  /* arcade */
  const ac = d.arcade;
  if (ac && on(ac.enabled, false)){
    const IC = { catcher: '<svg viewBox="0 0 24 24"><path d="M12 3 21 12l-9 9-9-9 9-9Z"/></svg>', pong: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 5v5M21 14v5"/></svg>', ext: '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 14h.01"/></svg>' };
    const pick = (k, ic, name, meta) => `<button class="pick${k === "catcher" ? " on" : ""}" data-g="${k}"><i class="ic">${ic}</i><span><b>${name}</b><em>${meta}</em></span></button>`;
    const x = ac.external || {};
    let host = "external site"; try { host = new URL(x.url).hostname.replace(/^www\./, ""); } catch(e){}
    secs.push(["play", "Play", head(ac.title, ac.note) + `<div class="card game rv">
        <div class="game-h"><b>${esc(ac.headline || "")}</b><span>${esc(ac.sub || "")}</span></div>
        <div class="picks">${pick("catcher", IC.catcher, "Brief Catcher", "Play here")}${pick("pong", IC.pong, "Rally", "Play here")}
          ${x.url && on(x.enabled) ? `<a class="pick wide" href="${esc(x.url)}" target="_blank" rel="noopener"><i class="ic">${IC.ext}</i><span class="ext-t"><b>${esc(x.label || "Demo")}</b><em>${esc(x.tagline || "Playable demo")}</em></span><span class="ext-r"><span class="demo">Demo</span><span class="host">${esc(host)} ↗</span></span></a>` : ""}</div>
        <div class="stage" id="stage"><canvas id="cv"></canvas>
          <div class="hud"><span><i id="l1">Score</i> <b id="v1">0</b></span><span><i id="l2">Best</i> <b id="v2">0</b></span><span><i id="l3">Lives</i> <b id="v3">3</b></span></div>
          <div class="ovl" id="ovl"><div><h4 id="ovlT">Brief Catcher</h4><p id="ovlP">Catch the briefs, dodge the revisions.</p><button class="btn solid" id="ovlB">Play</button></div></div></div>
      </div>`]);
  }

  /* closing */
  const cl = d.closing || {};
  const tel = (c.phone || "").replace(/[^\d+]/g, ""), wa = (c.whatsapp || "").replace(/\D/g, "");
  secs.push(["contact", "Contact", `<div class="end">
      <h2 class="rv">${esc(cl.title || "Have a brief?")}</h2>${cl.note ? `<p class="rv">${esc(cl.note)}</p>` : ""}
      ${c.email ? `<a class="mail rv" href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ""}
      <div class="acts rv">
        ${c.email ? `<a class="btn solid" href="mailto:${esc(c.email)}">Email me${ARROW}</a>` : ""}
        ${wa ? `<a class="btn" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp${ARROW}</a>` : ""}
        ${tel ? `<a class="btn" href="tel:${esc(tel)}">Call</a>` : ""}
        ${on(s.showVCard) ? `<button class="btn" id="bCard">Save contact${I_DL}</button>` : ""}
      </div></div>`]);

  /* hero */
  const status = [p.status?.show ? p.status.label : "", p.location].filter(Boolean).map(esc).join(" · ");
  const acts = live(d.actions).map(a => `<a class="btn${a.primary ? " solid" : ""}" href="${esc(a.url)}"${ext(a.url)}>${esc(a.label)}${ARROW}</a>`).join("");
  const hero = `<section class="hero" id="hero"><div class="wrap">
      <div class="h-top rv">${p.photo ? `<span class="photo"><img src="${esc(p.photo)}" alt="${esc(p.name)}" onerror="this.parentNode.remove()"></span>` : ""}
        ${status ? `<span class="pill"><span class="dot${p.status?.live !== false ? " live" : ""}"></span>${status}</span>` : ""}</div>
      <h1 class="rv">${esc(p.name)}</h1>
      ${p.role ? `<p class="role rv">${esc(p.role)}</p>` : ""}
      ${(p.facts || []).length ? `<p class="facts rv">${p.facts.map(x => { const m = String(x).match(/^(\S+)\s+(.*)$/); return m ? `<span><b class="n">${esc(m[1])}</b> ${esc(m[2])}</span>` : `<span>${esc(x)}</span>`; }).join("")}</p>` : ""}
      ${p.bio ? `<p class="bio rv"${arc(p.bio)}>${esc(p.bio)}</p>` : ""}
      ${(p.capabilities || []).length ? `<p class="focus rv">${p.capabilities.map(x => `<span>${esc(x)}</span>`).join("")}</p>` : ""}
      <div class="acts rv">${acts}</div>
      ${(p.socials || []).length ? `<div class="me-socs rv">${p.socials.map(x => `<a class="si" href="${esc(x.url)}"${ext(x.url)} aria-label="${esc(p.name)} on ${esc(x.net)}">${icon(x.net)}</a>`).join("")}</div>` : ""}
    </div></section>`;

  if (window.V10) V10.patch(secs, d);
  /* assemble: plain sections, worlds after the map */
  let html = hero, band = 0, navItems = [];
  const put = ([id, label, inner]) => { html += `<section class="sec${band++ % 2 === 0 ? " band" : ""}" id="${id}" data-nav><div class="wrap">${inner}</div></section>`; navItems.push([id, label]); };
  secs.forEach(sct => {
    put(sct);
    if (sct[0] === "map" || (sct[0] === "numbers" && !secs.some(x => x[0] === "map"))){
      worldHTML.forEach(([id, label, h]) => { html += h; navItems.push([id, label]); });
      worldHTML.length = 0;
    }
  });
  worldHTML.forEach(([id, label, h]) => { html += h; navItems.push([id, label]); });
  app.innerHTML = html + `<footer><div class="wrap"><span>© ${new Date().getFullYear()} ${esc(p.name)} · ${esc(p.monogram || "NM*")}</span><a href="#hero">Back to top ↑</a></div></footer>`;
  nav.innerHTML = navItems.map(([id, label]) => `<a href="#${id}" data-id="${id}">${esc(label)}</a>`).join("");

    const k = t => { const e = Math.min(1, (t - t0) / ms), q = e < .5 ? 4 * e * e * e : 1 - Math.pow(-2 * e + 2, 3) / 2;
      set(from + (to - from) * q); if (e < 1) anim = requestAnimationFrame(k); else { anim = 0; done && done(); } };

  set(92);

    if (slow) return set(50);

  let id = null;

    const x = items[+b.dataset.bat]; if (!x) return;
